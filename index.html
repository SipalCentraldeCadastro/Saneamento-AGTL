<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saneamento de Dados Mestres MM · AGTL Porto</title>
<style>
:root{--bg:#f4f6f9;--sf:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#0a6ed1;--ok:#107e3e;--wn:#e9730c;--er:#bb0000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--sf:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--bd:#334155;--ac:#4aa3ff;--ok:#34d399;--wn:#fb923c;--er:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--sf:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--bd:#334155;--ac:#4aa3ff;--ok:#34d399;--wn:#fb923c;--er:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#0b2a4a;color:#fff;padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px}header small{color:#9fb6d0}
.btn{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}header .btn{background:#ffffff1a;color:#fff;border-color:#ffffff40}
nav{display:flex;gap:2px;padding:0 24px;background:var(--sf);border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;color:var(--mu);font-size:14px;white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{padding:20px 24px;max-width:1500px;margin:auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px}
.k b{display:block;font-size:30px}.k span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
h2{font-size:15px;margin:0 0 12px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;font-size:12px;margin:10px 0 4px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:980px}th{background:var(--bg);text-align:left;font-size:11px;text-transform:uppercase;color:var(--mu);padding:8px;position:sticky;top:0}
td{border-top:1px solid var(--bd);padding:4px;vertical-align:top}
td input,td select,td textarea{width:100%;border:1px solid transparent;background:transparent;color:inherit;font:inherit;padding:5px;border-radius:5px;resize:vertical}
td input:hover,td select:hover,td textarea:hover{border-color:var(--bd)}td input:focus,td select:focus,td textarea:focus{border-color:var(--ac);outline:0;background:var(--bg)}
tr.late td:nth-child(7) input{color:var(--er);font-weight:700}
.bs{font-weight:600}.s-Concluído{color:var(--ok)}.s-Bloqueado{color:var(--er)}.s-Em\ andamento{color:var(--ac)}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}.tb select,.tb input{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx)}
.x{background:none;border:0;color:var(--er);cursor:pointer;font-size:16px}
.hint{color:var(--mu);font-size:12px;margin:8px 0}
#xm{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#xm.on{display:flex}#xm .card{max-width:780px;width:100%;max-height:90vh;overflow:auto}
.ch{display:inline-flex;gap:4px;margin:2px 12px 2px 0;align-items:center}#fs{font-size:12px;color:#9fb6d0}
#rep{display:none;color:#000;background:#fff}@media print{body>*:not(#rep){display:none!important}#rep{display:block}#rep td,#rep th{border:1px solid #999;padding:4px;color:#000}}
</style></head><body>
<header><div><h1>Saneamento de Dados Mestres MM · AGTL Porto</h1><small>Gestão de escopo, prazos e responsáveis · base replicada da Usimat</small></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span id="fs"></span><button class="btn p" onclick="openX()">Compartilhar / Exportar</button><button class="btn" onclick="saveF()">Salvar dados</button><button class="btn" onclick="openF()">Abrir dados</button><button class="btn" onclick="loadSite()">Carregar do site</button><button class="btn" onclick="rst()">Restaurar modelo</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div></header>
<nav id="nav"></nav><main id="m"></main><div id="xm"></div><div id="rep"></div>
<script>
const FASES=["1 Mobilização","2 Levantamento","3 Saneamento","4 Validação e Inventário","5 Encerramento"];
const ST=["Não iniciado","Em andamento","Bloqueado","Concluído"],PR=["Alta","Média","Baixa"];
const T=(f,fr,t,h,sap,r,d,p)=>({f,fr,t,h,sap,r,d,p:p||"Média",s:"Não iniciado"});
const DEF={tasks:[
T(0,"Governança","Criar grupo no Teams do projeto Porto e centralizar comunicação","Incluir Augusto, Marcelo, Vilmar, Leonardo e equipe do almoxarifado. Gravação e arquivos ficam no grupo (mesmo modelo da Usimat).","Teams","Augusto","2026-10-23","Alta"),
T(0,"Governança","Incluir Vilmar e Marcelo no treinamento de cadastro (sexta, 10h) e na lista de solicitantes","Enviar convite e acrescentar à lista de usuários solicitantes de cadastro. Apresentar o site de busca por similaridade e o manual.","Teams / site MDM","Augusto","2026-10-22","Alta"),
T(0,"Governança","Definir planilha-mestre de acompanhamento (padrão Usimat)","Abas por cenário: duplicidade, inativados, UMB/classe de avaliação, preço, quantidade. O Porto já planilha o que levanta; alinhar o layout.","Excel / SharePoint","Augusto + Vilmar","2026-10-27"),
T(0,"Governança","Elaborar documento com cenários e colunas que o Porto precisa trazer","Compromisso da reunião: Augusto lista os pontos a levantar, o Porto indica os materiais de cada cenário.","Documento","Augusto","2026-10-27","Alta"),
T(1,"Cadastro","Levantar materiais do Porto com cadastro inativo (prefixo INAT) e localizar o similar","Buscar no SAP pela descrição: aparecem o INAT e o similar criado. Se não existir similar, listar para solicitação (MDG ou carga em massa).","MM03 / Fiori / MARA-MAKT","Vilmar","2026-11-06","Alta"),
T(1,"Cadastro","Levantar materiais com descrição alterada que mudou o sentido","Ex.: catalisador 3.600 mL virou 720 mL. Montar a lista caso a caso; Augusto avalia reverter ou criar o cadastro correto.","MM03 / histórico de alterações","Vilmar","2026-11-06","Alta"),
T(1,"Cadastro","Levantar materiais com unidade de medida básica (UMB) incorreta","UMB deve ser a unidade que controla o estoque (litro, kg). A unidade de compra vai como UM alternativa.","MARA-MEINS / MARM","Vilmar","2026-11-10","Alta"),
T(1,"Cadastro","Levantar materiais com classe de avaliação ou centro de lucro incorretos","UMB, classe de avaliação e centro de lucro não mudam após o material ser movimentado: exige inativar e recriar.","MBEW-BKLAS / MARC","Vilmar","2026-11-10"),
T(1,"Preço","Levantar materiais com preço exorbitante vindo da carga inicial","Ex.: motor 150 CV subiu com 21 unidades, ~R$ 1 mi em estoque. Indicar material, valor atual e valor correto validado pelo almoxarifado.","MM03 contábil / MBEW","Vilmar","2026-11-10","Alta"),
T(1,"Estoque","Levantar materiais controlados fora do SAP (GESTO, ex-OTK)","Comparar saldo GESTO × SAP. Ex.: 4.000 L na planilha de carga e ~2.000 L no SAP. Identificar o que existe só no GESTO.","GESTO / MMBE","Vilmar","2026-11-13"),
T(1,"Estoque","Levantar notas recebidas sem MIGO e requisições sem saldo","Vilmar tem ~130 requisições sem saldo e a lista de notas não lançadas. Marcelo/Leonardo tratam cerca de 50 pedidos com a regional.","ME2M / MB51 / MB25","Vilmar + Leonardo","2026-10-30","Alta"),
T(2,"Cadastro","Reverter ou recriar cadastros de descrição alterada","Avaliar caso a caso. A descrição só pode ser simplificada quando for de fato o mesmo material, considerando todas as filiais.","MDG / MM02","Augusto","2026-11-20"),
T(2,"Cadastro","Cadastrar materiais inativados sem similar","Via solicitação direta no MDG ou lista em massa passada ao Augusto. Cadastrar sempre com a UMB correta.","MDG / carga em massa","Augusto","2026-11-20","Alta"),
T(2,"Cadastro","Recriar materiais com UMB/classe incorreta e inativar o antigo","Criar o novo com unidade correta e inativar o antigo com INAT à frente da descrição. Conferir impacto na Usimat e nas demais filiais.","MDG / MM06","Augusto","2026-11-27","Alta"),
T(2,"Cadastro","Configurar UM alternativa e fator de conversão","O comprador converte direto no pedido; se não houver conversão no cadastro, pede ao Augusto. Cobre caixa, kg, tonelada e variação por fornecedor.","MARM / ME21N","Compradores + Augusto","2026-11-27"),
T(2,"Preço","Corrigir preço do saldo pela Controladoria","O preço é standard e só atualiza no fechamento de custo mensal. Há chamado aberto com a TI; ajuste via MR21.","MR21","Controladoria","2026-12-04","Alta"),
T(2,"Estoque","Transferir saldo do código inativo para o novo","Executar após a criação do novo código, com o preço validado pela área.","MIGO 309","Almoxarifado Porto","2026-12-04"),
T(2,"Estoque","Padronizar posição de depósito","Transação Z (Fiori), 9 caracteres (corredor/prateleira/andar). Material precisa existir no depósito. Passar a transação no chat. Paranaguá está com ~50% endereçado.","Transação Z / Fiori","Vilmar","2026-12-11","Baixa"),
T(3,"Estoque","Regularizar MIGOs pendentes antes do inventário","Lançar as notas paradas e tratar as requisições sem saldo, para o inventário não ser distorcido.","MIGO / MB51","Vilmar + Fiscal","2026-11-20","Alta"),
T(3,"Estoque","Definir estratégia de inventário por família","Contar por família, bloquear a movimentação da família, ajustar e liberar. Contar tudo antes de ajustar não funciona: o estoque movimenta durante 2 a 3 semanas.","MI01 / MI04 / MI07","Vilmar + Augusto + Marcelo","2026-11-27","Alta"),
T(3,"Estoque","Executar inventário e ajustar saldos","Ordem por família, com congelamento e ajuste. O cadastro precisa estar saneado antes.","MI01 / MI04 / MI07","Almoxarifado Porto","2027-01-29","Alta"),
T(3,"Estoque","Migrar os materiais do GESTO para o SAP","Depois do saneamento, deixar todo o controle dentro do SAP e desativar o controle paralelo.","SAP MM","Vilmar + Augusto","2027-02-26"),
T(3,"Processo","Apurar com o Fiscal a entrada de MIGO pelo almoxarifado","Hoje a Central de Notas lança até uma semana depois do recebimento. Marcelo verifica a decisão tomada para a Usimat e compartilha.","MIGO / processo fiscal","Marcelo","2026-11-06"),
T(4,"Acessos","Sanear acessos de edição de cadastro (MM02)","Nem todos devem editar cadastro. Revisar quem tem acesso e usar a transação Z de posição de depósito para o restante.","SU01 / PFCG","Augusto","2027-03-12","Baixa"),
T(4,"Processo","Planejar implantação de MRP (mínimo/máximo)","Fase futura, depois do cadastro e do estoque corrigidos. Segue o modelo da Usimat.","MRP / MARC","Augusto + Vilmar","2027-03-31","Baixa")],
scope:[["Inativados sem similar",0,0],["Descrição alterada com mudança de sentido",0,0],["UMB incorreta",0,0],["Classe de avaliação / centro de lucro incorretos",0,0],["Preço incorreto (carga)",0,0],["Duplicidades",0,0],["Saldo divergente do físico",0,0],["Materiais só no GESTO",0,0],["Notas sem MIGO / requisições sem saldo",0,0]],
risks:[["Inventário com sistema em movimento invalida a contagem","Alto","Inventário por família com congelamento","Vilmar"],["Material é global: alterar no Porto afeta Usimat e outras filiais","Alto","Avaliar impacto em todas as filiais antes de alterar ou criar","Augusto"],["UMB, classe de avaliação e centro de lucro são irreversíveis após movimentação","Alto","Inativar e recriar o material","Augusto"],["MIGO atrasada distorce saldo e gera requisições sem saldo","Médio","Definir regra com o Fiscal e regularizar pendências","Marcelo"],["Preço standard só atualiza no fechamento de custo","Médio","Alinhar com a Controladoria; ajuste via MR21","Controladoria"],["Controle paralelo no GESTO gera duplo trabalho","Médio","Migrar tudo ao SAP após o saneamento","Vilmar"],["Pressão por simplificar descrição muda o sentido do material","Médio","Descrição só muda se for o mesmo material","Augusto"]],
notes:[["Regra","A UMB é a unidade que controla o estoque. A unidade de compra vai como UM alternativa (MARM), com fator de conversão."],["Regra","UMB, classe de avaliação e centro de lucro não se alteram depois da movimentação: inativa (INAT) e cria novo."],["Regra","Descrição não será mais alterada, exceto quando for o mesmo material. 3,6 L e 720 mL são materiais diferentes."],["Regra","Preço standard: atualiza só quando a Controladoria fecha o custo do mês. Correção do saldo via MR21."],["Decisão","Sequência acordada: corrigir cadastro, regularizar pendências, inventário, depois implantar no SAP."],["Decisão","Planilha de acompanhamento compartilhada entre as equipes; comunicação no grupo do Teams."],["Pendência","Augusto monta o documento com os pontos a levantar. O Porto traz os materiais de cada cenário."],["Pendência","Marcelo verifica a decisão com o Fiscal sobre MIGO pelo almoxarifado e compartilha."],["Pendência","Vilmar envia a lista de notas recebidas sem MIGO. Marcelo trata cerca de 50 pedidos com Leonardo."],["Informação","Treinamento de cadastro na sexta às 10h. Vilmar e Marcelo serão adicionados."],["Informação","MRP segue como linha futura, após o cadastro e o estoque estarem corretos."]]};
let S,tab=0;const ld=()=>{try{const r=localStorage.getItem("agtl_s");return r?JSON.parse(r):null}catch(e){return null}};
const sv=()=>{try{localStorage.setItem("agtl_s",JSON.stringify(S))}catch(e){}wf()};
S=ld()||JSON.parse(JSON.stringify(DEF));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date().toISOString().slice(0,10);
const late=t=>t.s!="Concluído"&&t.d&&t.d<today;
const TABS=["Visão geral","Plano de ação","Escopo","Riscos","Reunião"];
function nav(){document.getElementById("nav").innerHTML=TABS.map((x,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};draw()">${x}</button>`).join("")}
const pct=a=>a.length?Math.round(a.filter(t=>t.s=="Concluído").length/a.length*100):0;
function sel(o,v,fn){return `<select onchange="${fn}(this.value)">${o.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("")}</select>`}
function ov(){const t=S.tasks;const sc=S.scope.reduce((a,x)=>[a[0]+x[1],a[1]+x[2]],[0,0]);
return `<div class="grid"><div class="card k"><span>Progresso geral</span><b>${pct(t)}%</b></div><div class="card k"><span>Tarefas</span><b>${t.length}</b></div><div class="card k"><span>Atrasadas</span><b style="color:var(--er)">${t.filter(late).length}</b></div><div class="card k"><span>Bloqueadas</span><b style="color:var(--wn)">${t.filter(x=>x.s=="Bloqueado").length}</b></div><div class="card k"><span>Materiais tratados</span><b>${sc[1]}/${sc[0]}</b></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="card"><h2>Progresso por fase</h2>${FASES.map((f,i)=>{const a=t.filter(x=>x.f==i);return `<div class="row"><span>${f}</span><span>${pct(a)}% (${a.filter(x=>x.s=="Concluído").length}/${a.length})</span></div><div class="bar"><i style="width:${pct(a)}%"></i></div>`}).join("")}</div>
<div class="card"><h2>Próximos prazos</h2>${t.filter(x=>x.s!="Concluído").sort((a,b)=>a.d.localeCompare(b.d)).slice(0,7).map(x=>`<div class="row" style="margin:6px 0"><span>${esc(x.t)}<br><small style="color:var(--mu)">${esc(x.r)}</small></span><b style="color:${late(x)?"var(--er)":"inherit"};white-space:nowrap">${x.d.split("-").reverse().join("/")}</b></div>`).join("")}</div></div>`}
function pl(){const fr=[...new Set(S.tasks.map(x=>x.fr))];const F=window.fl||{};
const rows=S.tasks.map((x,i)=>({x,i})).filter(({x})=>(!F.f||x.f==F.f-1)&&(!F.s||x.s==F.s)&&(!F.r||x.r.toLowerCase().includes(F.r.toLowerCase())));
return `<div class="tb"><select onchange="fl.f=+this.value;draw()"><option value="0">Todas as fases</option>${FASES.map((f,i)=>`<option value="${i+1}" ${F.f==i+1?"selected":""}>${f}</option>`).join("")}</select><select onchange="fl.s=this.value;draw()"><option value="">Todos os status</option>${ST.map(s=>`<option ${F.s==s?"selected":""}>${s}</option>`).join("")}</select><input placeholder="Responsável…" value="${esc(F.r||"")}" onchange="fl.r=this.value;draw()"><button class="btn p" onclick="addT()">+ Tarefa</button></div>
<div class="tw"><table><tr><th>Fase</th><th>Frente</th><th>Tarefa</th><th>Como fazer</th><th>SAP / Ferramenta</th><th>Responsável</th><th>Prazo</th><th>Prior.</th><th>Status</th><th></th></tr>
${rows.map(({x,i})=>`<tr class="${late(x)?"late":""}"><td>${sel(FASES,FASES[x.f],`v=>upT(${i},'f',FASES.indexOf(v))`).replace(/onchange="([^"]*)\(this.value\)"/,'onchange="upT('+i+",'f',FASES.indexOf(this.value))\"")}</td><td><input value="${esc(x.fr)}" onchange="upT(${i},'fr',this.value)"></td><td><textarea rows="2" onchange="upT(${i},'t',this.value)">${esc(x.t)}</textarea></td><td><textarea rows="3" onchange="upT(${i},'h',this.value)">${esc(x.h)}</textarea></td><td><input value="${esc(x.sap)}" onchange="upT(${i},'sap',this.value)"></td><td><input value="${esc(x.r)}" onchange="upT(${i},'r',this.value)"></td><td><input type="date" value="${x.d}" onchange="upT(${i},'d',this.value)"></td><td><select onchange="upT(${i},'p',this.value)">${PR.map(p=>`<option ${p==x.p?"selected":""}>${p}</option>`).join("")}</select></td><td><select class="bs s-${x.s}" onchange="upT(${i},'s',this.value)">${ST.map(s=>`<option ${s==x.s?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="x" onclick="delT(${i})">×</button></td></tr>`).join("")}</table></div><p class="hint">Todos os campos são editáveis. As alterações ficam salvas neste navegador; use “Exportar JSON” para backup. Prazos em vermelho estão atrasados.</p>`}
function sc(){return `<p class="hint">Cada cenário corresponde a uma lista que o Porto precisa trazer. Preencha os totais identificados e tratados.</p><div class="tw"><table style="min-width:600px"><tr><th>Cenário</th><th>Identificados</th><th>Tratados</th><th>%</th><th></th></tr>${S.scope.map((x,i)=>`<tr><td><input value="${esc(x[0])}" onchange="S.scope[${i}][0]=this.value;sv()"></td><td><input type="number" min="0" value="${x[1]}" onchange="S.scope[${i}][1]=+this.value;sv();draw()"></td><td><input type="number" min="0" value="${x[2]}" onchange="S.scope[${i}][2]=+this.value;sv();draw()"></td><td>${x[1]?Math.round(x[2]/x[1]*100):0}%</td><td><button class="x" onclick="S.scope.splice(${i},1);sv();draw()">×</button></td></tr>`).join("")}</table></div><p><button class="btn p" onclick="S.scope.push(['Novo cenário',0,0]);sv();draw()">+ Cenário</button></p>`}
function rk(){return `<div class="tw"><table style="min-width:700px"><tr><th>Risco</th><th>Impacto</th><th>Mitigação</th><th>Dono</th><th></th></tr>${S.risks.map((x,i)=>`<tr>${[0,1,2,3].map(j=>j==1?`<td><select onchange="S.risks[${i}][1]=this.value;sv()">${["Alto","Médio","Baixo"].map(o=>`<option ${o==x[1]?"selected":""}>${o}</option>`).join("")}</select></td>`:`<td><textarea rows="2" onchange="S.risks[${i}][${j}]=this.value;sv()">${esc(x[j])}</textarea></td>`).join("")}<td><button class="x" onclick="S.risks.splice(${i},1);sv();draw()">×</button></td></tr>`).join("")}</table></div><p><button class="btn p" onclick="S.risks.push(['','Médio','','']);sv();draw()">+ Risco</button></p>`}
function nt(){return `<p class="hint">Resumo da reunião com o Porto (AGTL) em 20/10/2026. Participantes: Augusto, Marcelo, Vilmar, Leonardo.</p><div class="tw"><table style="min-width:600px"><tr><th style="width:130px">Tipo</th><th>Ponto</th><th></th></tr>${S.notes.map((x,i)=>`<tr><td><select onchange="S.notes[${i}][0]=this.value;sv()">${["Regra","Decisão","Pendência","Informação"].map(o=>`<option ${o==x[0]?"selected":""}>${o}</option>`).join("")}</select></td><td><textarea rows="2" onchange="S.notes[${i}][1]=this.value;sv()">${esc(x[1])}</textarea></td><td><button class="x" onclick="S.notes.splice(${i},1);sv();draw()">×</button></td></tr>`).join("")}</table></div><p><button class="btn p" onclick="S.notes.push(['Pendência','']);sv();draw()">+ Ponto</button></p>`}
window.fl={};
function upT(i,k,v){S.tasks[i][k]=v;sv();if(k=="s"||k=="d")draw()}
function addT(){S.tasks.unshift(T(1,"","Nova tarefa","","","",today));sv();draw()}
function delT(i){if(confirm("Excluir tarefa?")){S.tasks.splice(i,1);sv();draw()}}
function draw(){nav();document.getElementById("m").innerHTML=[ov,pl,sc,rk,nt][tab]()}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="saneamento_porto.json";a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);sv();draw()}catch(e){alert("Arquivo inválido")}};r.readAsText(f)}
function rst(){if(confirm("Restaurar o modelo original? Suas edições serão perdidas.")){S=JSON.parse(JSON.stringify(DEF));sv();draw()}}
let FH=null,X={};
const fd=d=>d?d.split("-").reverse().join("/"):"—";
const own=t=>t.r.split("+").map(x=>x.trim()).filter(Boolean);
const xr=()=>S.tasks.filter(t=>(!X.r.size||own(t).some(o=>X.r.has(o)))&&X.f.has(t.f)&&X.s.has(t.s)&&(!X.l||late(t)));
function dl(b,n){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click()}
async function wf(){if(!FH)return;try{const w=await FH.createWritable();await w.write(JSON.stringify(S,null,1));await w.close();document.getElementById("fs").textContent="Salvo em "+FH.name+" · "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(e){document.getElementById("fs").textContent="Falha ao gravar no arquivo"}}
async function saveF(){if(!window.showSaveFilePicker){exp();alert("Seu navegador não grava direto em arquivo. Baixei o JSON; use Chrome ou Edge para o salvamento automático.");return}try{FH=await showSaveFilePicker({suggestedName:"dados.json",types:[{accept:{"application/json":[".json"]}}]});await wf()}catch(e){}}
async function openF(){if(!window.showOpenFilePicker){document.getElementById("imp").click();return}try{const [h]=await showOpenFilePicker({types:[{accept:{"application/json":[".json"]}}]});S=JSON.parse(await(await h.getFile()).text());FH=h;try{localStorage.setItem("agtl_s",JSON.stringify(S))}catch(e){}document.getElementById("fs").textContent="Conectado a "+h.name+" (salva a cada edição)";draw()}catch(e){}}
function loadSite(){fetch("dados.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{if(confirm("Substituir os dados atuais pelos do site (dados.json)?")){S=d;sv();draw()}}).catch(()=>alert("dados.json não encontrado no site."))}
function chk(g,v,l,on){return `<label class="ch"><input type="checkbox" ${on?"checked":""} onchange="tg('${g}',${JSON.stringify(v).replace(/"/g,"&quot;")},this.checked)">${esc(l)}</label>`}
function tg(g,v,on){if(g=="l")X.l=on;else on?X[g].add(v):X[g].delete(v);xd()}
function openX(){const rs=[...new Set(S.tasks.flatMap(own))].sort();X={r:new Set(),f:new Set([0,1,2,3,4]),s:new Set(["Não iniciado","Em andamento","Bloqueado"]),l:false,rs};xd();document.getElementById("xm").classList.add("on")}
function xtxt(t){return `SANEAMENTO DE DADOS MESTRES · AGTL PORTO\nPosição em ${fd(today)} · ${t.length} tarefa(s)\n`+[...t].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>`\n• ${x.t}\n  Fase: ${FASES[x.f]} | Resp.: ${x.r||"—"} | Prazo: ${fd(x.d)}${late(x)?" (ATRASADA)":""} | ${x.p} | ${x.s}\n  Como fazer: ${x.h}${x.sap?`\n  SAP/Ferramenta: ${x.sap}`:""}`).join("\n")}
function xd(){const t=xr();document.getElementById("xm").innerHTML=`<div class="card"><h2>Compartilhar / Exportar plano</h2><b>Responsáveis</b> <span class="hint">(nenhum marcado = todos)</span><div>${X.rs.map(r=>chk("r",r,r,X.r.has(r))).join("")}</div><p><b>Fases</b><br>${FASES.map((f,i)=>chk("f",i,f,X.f.has(i))).join("")}</p><p><b>Status</b><br>${ST.map(s=>chk("s",s,s,X.s.has(s))).join("")}${chk("l",true,"Somente atrasadas",X.l)}</p><p><b>${t.length}</b> tarefa(s) selecionada(s)</p><textarea id="xt" readonly rows="9" style="width:100%;font:12px monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px">${esc(xtxt(t))}</textarea><div class="tb" style="margin-top:10px"><button class="btn p" onclick="xcsv()">Baixar Excel (CSV)</button><button class="btn" onclick="xcp()">Copiar texto (Teams/e-mail)</button><button class="btn" onclick="xml()">Abrir e-mail</button><button class="btn" onclick="xpr()">Imprimir / PDF</button><button class="btn" onclick="document.getElementById('xm').classList.remove('on')">Fechar</button></div></div>`}
function xcsv(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const c=["Fase","Frente","Tarefa","Como fazer","SAP/Ferramenta","Responsável","Prazo","Prioridade","Status","Atrasada"];const l=[c.map(q).join(";"),...xr().map(x=>[FASES[x.f],x.fr,x.t,x.h,x.sap,x.r,fd(x.d),x.p,x.s,late(x)?"Sim":"Não"].map(q).join(";"))];dl(new Blob(["\ufeff"+l.join("\r\n")],{type:"text/csv;charset=utf-8"}),"plano_saneamento_porto.csv")}
function xcp(){const e=document.getElementById("xt");e.select();(navigator.clipboard?navigator.clipboard.writeText(e.value):Promise.reject()).then(()=>alert("Texto copiado.")).catch(()=>{try{document.execCommand("copy");alert("Texto copiado.")}catch(_){alert("Selecione o texto e copie com Ctrl+C.")}})}
function xml(){const t=xtxt(xr());location.href="mailto:?subject="+encodeURIComponent("Saneamento Porto · plano de ação "+fd(today))+"&body="+encodeURIComponent(t.slice(0,1800)+(t.length>1800?"\n\n[…] Lista completa: anexe o CSV exportado.":""))}
function xpr(){const t=xr().sort((a,b)=>a.d.localeCompare(b.d));document.getElementById("rep").innerHTML=`<h2>Saneamento de Dados Mestres · AGTL Porto</h2><p>Posição em ${fd(today)}</p><table style="min-width:0;font-size:11px"><tr><th>Fase</th><th>Tarefa</th><th>Como fazer</th><th>Resp.</th><th>Prazo</th><th>Status</th></tr>${t.map(x=>`<tr><td>${esc(FASES[x.f])}</td><td>${esc(x.t)}</td><td>${esc(x.h)}</td><td>${esc(x.r)}</td><td>${fd(x.d)}${late(x)?" ⚠":""}</td><td>${x.s}</td></tr>`).join("")}</table>`;window.print()}
draw();
if(!ld())fetch("dados.json",{cache:"no-store"}).then(r=>r.ok?r.json():0).then(d=>{if(d&&d.tasks){S=d;draw()}}).catch(()=>{});
</script></body></html>
